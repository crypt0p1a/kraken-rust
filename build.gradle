buildscript {
    apply from: gradle.extended.files.modules
    apply from: "gradle/versions.gradle"
}

plugins {
    alias(additionals.plugins.kotlin.multiplatform) apply false
    alias(additionals.plugins.android.kotlin.multiplatform.library) apply false
    alias(rust.plugins.ubique.uniffi) apply false
    id("idea")
}

group = rootProject.ext.group
version = rootProject.ext.version

subprojects {
    group = rootProject.ext.group
    version = rootProject.ext.version

    tasks.register("allDeps", DependencyReportTask)

    if (rootProject.isSourcesModule(it)) {
        apply from: gradle.extended.files.moduleSetup
    }
}
