[workspace]
resolver = "3"
members = [
  "crates/kraken-crypto",
  "crates/kraken-network",
  "crates/kraken-spot-api",
  "crates/kraken-dashboard",
  "crates/kraken-ffi",
  "crates/kraken-trading-bot",
  "crates/trading-notify",
  "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/crypt0p1a/kraken-rust"

[workspace.dependencies]
# crates of the workspace
# published on crates.io: the version of the workspace, written again here for the registry
kraken-spot-api = { path = "crates/kraken-spot-api", version = "0.1.0" }
kraken-crypto = { path = "crates/kraken-crypto", version = "0.1.0" }
kraken-network = { path = "crates/kraken-network", version = "0.1.0" }
kraken-trading-bot = { path = "crates/kraken-trading-bot" }
trading-notify = { path = "crates/trading-notify" }

# trading bot
# the indicators of the market (ATR, EMA, linear regression), on candles in f64
yata = { version = "0.7.0", default-features = false }
# the managers copied by the virtual managers, picked at random
fastrand = "2.3.0"
humantime-serde = "1.1.1"
# notifications: only the async dispatcher, on rustls
ntfy = { version = "0.9.1", default-features = false, features = ["async-dispatcher", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
rust_decimal_macros = "1"
serde_norway = "0.9.42"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# same versions as cex-spot-trading, to merge the providers later
base64 = "0.22.1"
hmac = "0.12.1"
# rustls on ring: cross-compiles for Android and iOS without the cmake of aws-lc-rs
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false }
uniffi = "=0.32.0"

# dashboard: the terminal UI, with its crossterm backend
ratatui = "0.30.2"

# tests only
serde_ignored = "0.1.14"
wiremock = "0.6.5"

[profile.release]
# rustc strips the macOS dylibs with its rust-objcopy (LLVM), whose output is rejected by dlopen:
# "mis-aligned LINKEDIT string pool". Apple's strip doesn't have the issue
strip = false
