name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # every day: the live contract tests detect the changes of the Kraken API
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: Secrets (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks, whole history (default rules + entropy rules of .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: gitleaks, working tree (files ignored by git included)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: trufflehog, whole history (verified and unverified secrets)
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified,unknown,unverified
      - name: no credentials file committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must not be committed"; exit 1
          fi

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit, mocked, fixture and facade tests (offline)
        run: cargo nextest run --workspace --locked --profile ci
      - name: Documentation tests
        run: cargo test --workspace --locked --doc
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Offline tests with coverage
        run: cargo llvm-cov nextest --workspace --locked --profile ci --no-report
      - name: Reports (lcov, HTML, summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          {
            echo "## Coverage"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Minimum coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
      - name: Codecov (when the CODECOV_TOKEN secret is set)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android, os: ubuntu-latest, targets: android }
          - { name: ios, os: macos-latest, targets: ios }
          - { name: macos, os: macos-latest, targets: macos }
          - { name: linux-x86_64, os: ubuntu-latest, targets: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-gnu }
          - { name: windows, os: windows-latest, targets: windows }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}
      - name: Android NDK and cargo-ndk
        if: matrix.name == 'android'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install --locked cargo-ndk
      - name: Build the libraries of kraken-ffi
        shell: bash
        run: scripts/build.sh ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-ffi-${{ matrix.name }}
          path: dist/

  crates:
    name: Each crate alone (no uniffi feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for crate in kraken-crypto kraken-network kraken-api; do
            cargo test -p "$crate" --locked
            if cargo tree -p "$crate" -e normal | grep -q uniffi; then
              echo "::error::$crate depends on uniffi without its feature"; exit 1
            fi
          done

  audit:
    name: Vulnerabilities of the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  live-public:
    name: Contract of the public API (real Kraken)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p kraken-api --locked --profile live --run-ignored only --test live_market
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-live-public
          path: target/nextest/live/junit.xml
          if-no-files-found: ignore

  live-private:
    name: Contract of the private API (real Kraken, read only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
      KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Account and trading (orders validated only, never placed)
        if: env.KRAKEN_API_KEY != ''
        run: >-
          cargo nextest run -p kraken-api --locked --profile live --run-ignored only
          --test live_account --test live_trading
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-live-private
          path: target/nextest/live/junit.xml
          if-no-files-found: ignore
      - name: Without credentials
        if: env.KRAKEN_API_KEY == ''
        run: echo "::warning::KRAKEN_API_KEY / KRAKEN_API_SECRET secrets not set, private contract skipped"

  report:
    name: Test report
    needs: [test, live-public, live-private]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      - name: Publish the results of every platform in a "Test results" check
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results
          files: junit/**/*.xml
