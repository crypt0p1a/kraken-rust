name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # every day: the live contract tests detect the changes of the Kraken API
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: Secrets (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks, whole history (default rules + entropy rules of .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: gitleaks, working tree (files ignored by git included)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: trufflehog, whole history (verified and unverified secrets)
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified,unknown,unverified
      - name: no credentials file committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env must not be committed"; exit 1
          fi

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit, mocked, fixture and facade tests (offline)
        run: cargo nextest run --workspace --locked --profile ci
      - name: Documentation tests
        run: cargo test --workspace --locked --doc
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # the loop of the executable needs the real Kraken: checked by the docker job instead
      IGNORED: --ignore-filename-regex (kraken-trading-bot/src/main\.rs|uniffi-bindgen/src/)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Offline tests with coverage
        run: cargo llvm-cov nextest --workspace --locked --profile ci --no-report
      - name: Reports (lcov, HTML, summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info $IGNORED
          cargo llvm-cov report --html --output-dir coverage $IGNORED
          {
            echo "## Coverage"
            echo '```'
            cargo llvm-cov report --summary-only $IGNORED
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Minimum coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 95 $IGNORED
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
      - name: Codecov (when the CODECOV_TOKEN secret is set)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android, os: ubuntu-latest, targets: android }
          - { name: ios, os: macos-latest, targets: ios }
          - { name: macos, os: macos-latest, targets: macos }
          - { name: linux-x86_64, os: ubuntu-latest, targets: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-gnu }
          - { name: windows, os: windows-latest, targets: windows }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}
      - name: Android NDK and cargo-ndk
        if: matrix.name == 'android'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install --locked cargo-ndk
      - name: Build the libraries of kraken-ffi
        shell: bash
        run: scripts/build.sh ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-ffi-${{ matrix.name }}
          path: dist/

  bindings-kotlin:
    name: Kotlin bindings (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Generate the bindings and test them on the JVM, against a mocked Kraken
        run: scripts/test-bindings.sh kotlin
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-bindings-kotlin
          path: platforms/kotlin/build/test-results/test/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-bindings-kotlin
          path: dist/bindings/kotlin

  bindings-swift-linux:
    name: Swift bindings (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Swift is installed on the Ubuntu runners
      - run: swift --version
      - name: Generate the bindings and test them with the library of the host
        run: scripts/test-bindings.sh swift

  android:
    name: Android (AAR, tests on an emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Android NDK and cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install --locked cargo-ndk
      - name: Libraries of every ABI, Kotlin bindings
        run: |
          scripts/build.sh android
          scripts/bindings.sh kotlin
      - name: AAR
        run: gradle -p platforms/android assembleRelease --console=plain
      - name: Enable KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests of the bindings on an Android emulator, against a mocked Kraken
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p platforms/android connectedDebugAndroidTest --console=plain
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-android
          path: platforms/android/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-android-aar
          path: platforms/android/build/outputs/aar/*.aar

  apple:
    name: Apple (XCFramework, tests on macOS and on the iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-xcframework
      - name: XCFramework, Swift bindings, tests on macOS
        run: scripts/test-bindings.sh swift
      - name: Tests on the iOS simulator
        run: scripts/test-bindings.sh ios
      - name: Swift package
        run: |
          cd platforms/apple
          zip -qr ../../kraken-swift-package.zip Package.swift Sources KrakenFFI.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: kraken-swift-package
          path: kraken-swift-package.zip

  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - name: Build the image of kraken-trading-bot
        run: docker build -t kraken-trading-bot:ci .
      - name: Refuses to start without credentials
        run: |
          set +e
          output=$(docker run --rm kraken-trading-bot:ci 2>&1)
          code=$?
          echo "$output"
          test "$code" -eq 1 && echo "$output" | grep -q "KRAKEN_API_KEY is required"
      - name: Checks the example configuration against the pairs of Kraken (public API)
        run: |
          docker run --rm \
            -e KRAKEN_API_KEY=not-a-key -e KRAKEN_API_SECRET=bm90LWEtc2VjcmV0 \
            -v "$PWD/managers.example.yaml:/config/managers.yaml:ro" \
            kraken-trading-bot:ci --check
      - name: Image size
        run: docker images kraken-trading-bot:ci --format '{{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

  crates:
    name: Each crate alone (no uniffi feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for crate in kraken-crypto kraken-network kraken-api; do
            cargo test -p "$crate" --locked
            if cargo tree -p "$crate" -e normal | grep -q uniffi; then
              echo "::error::$crate depends on uniffi without its feature"; exit 1
            fi
          done

  audit:
    name: Vulnerabilities of the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  live-public:
    name: Contract of the public API (real Kraken)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p kraken-api --locked --profile live --run-ignored only --test live_market
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-live-public
          path: target/nextest/live/junit.xml
          if-no-files-found: ignore

  live-private:
    name: Contract of the private API (real Kraken, read only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
      KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Account and trading (orders validated only, never placed)
        if: env.KRAKEN_API_KEY != ''
        run: >-
          cargo nextest run --locked --profile live --run-ignored only
          -p kraken-api --test live_account --test live_trading
          -p kraken-trading-bot --test live_dry_run
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-live-private
          path: target/nextest/live/junit.xml
          if-no-files-found: ignore
      - name: Without credentials
        if: env.KRAKEN_API_KEY == ''
        run: echo "::warning::KRAKEN_API_KEY / KRAKEN_API_SECRET secrets not set, private contract skipped"

  report:
    name: Test report
    needs: [test, bindings-kotlin, android, live-public, live-private]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      - name: Publish the results of every platform in a "Test results" check
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results
          files: junit/**/*.xml
