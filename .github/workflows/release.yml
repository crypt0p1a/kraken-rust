# A GitHub release for each tag X.Y.Z, for the Rust crates: the tag must be the version of the
# code, and changelogs/X.Y.Z.md its notes. No artifact: the crates are published on crates.io from
# a workstation, see docs/rust.md
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the version of the code, with its changelog
        run: scripts/check-release.sh "${GITHUB_REF_NAME}"
      - name: The crates package, without their tests
        run: |
          for crate in kraken-crypto kraken-network kraken-spot-api; do
            files=$(cargo package -p "$crate" --list --locked)
            if echo "$files" | grep -q '^tests/'; then
              echo "::error::$crate would publish its tests"; exit 1
            fi
          done
      - name: Release, with the changelog as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file "changelogs/${GITHUB_REF_NAME}.md"
