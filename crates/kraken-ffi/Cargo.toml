[package]
name = "kraken-ffi"
description = "UniFFI export of the Kraken Spot REST API, for the foreign-language bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# not published on crates.io: only kraken-crypto, kraken-network and kraken-spot-api are
publish = false

[lib]
name = "kraken_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
kraken-spot-api = { workspace = true, features = ["uniffi"] }
kraken-network = { workspace = true, features = ["uniffi"] }
uniffi = { workspace = true, features = ["tokio"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true
