[package]
name = "kraken-spot-api"
description = "Calls of the Kraken Spot REST API: market data, account and trading"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kraken", "exchange", "trading", "crypto", "api"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
# the tests and their fixtures stay in the repository: only the library is published
exclude = ["tests/"]

[features]
# Derives the UniFFI traits of the models
uniffi = ["dep:uniffi", "kraken-network/uniffi"]

[dependencies]
kraken-network.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
uniffi = { workspace = true, optional = true }

[dev-dependencies]
rust_decimal_macros.workspace = true
base64.workspace = true
hmac.workspace = true
serde_ignored.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock.workspace = true
