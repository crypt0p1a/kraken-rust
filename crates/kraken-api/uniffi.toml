# Bindings of the custom types: the exact decimals cross the FFI as their text ("0.00058823")
# and are rebuilt as the exact decimal type of the language, never as a float

[bindings.kotlin.custom_types.Decimal]
type_name = "BigDecimal"
imports = ["java.math.BigDecimal"]
lift = "BigDecimal({})"
lower = "{}.toPlainString()"

# Foundation.Decimal: base 10, 38 digits, more than the 28 of rust_decimal. Read and written with
# the POSIX locale: always a '.' as separator, whatever the locale of the device
[bindings.swift.custom_types.Decimal]
type_name = "Foundation.Decimal"
imports = ["Foundation"]
lift = "Foundation.Decimal(string: {}, locale: Locale(identifier: \"en_US_POSIX\"))!"
lower = "NSDecimalNumber(decimal: {}).description(withLocale: Locale(identifier: \"en_US_POSIX\"))"

# the C declarations of every crate are in a single module, the one of the XCFramework: KrakenFFI
# (scripts/bindings.sh), each crate keeping its own header
[bindings.swift]
ffi_module_name = "KrakenFFI"
ffi_module_filename = "kraken_apiFFI"
