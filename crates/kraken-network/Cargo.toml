[package]
name = "kraken-network"
description = "HTTP layer of the Kraken REST API: clients, rate limiter, nonce, answers and errors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["kraken", "exchange", "http", "rate-limit"]
categories = ["api-bindings", "network-programming"]
# the tests and their fixtures stay in the repository: only the library is published
exclude = ["tests/"]

[features]
# Derives the UniFFI traits of KrakenError and RestOptions
uniffi = ["dep:uniffi"]

[dependencies]
kraken-crypto.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uniffi = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock.workspace = true
