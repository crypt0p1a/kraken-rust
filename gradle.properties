#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.parallel=true
org.gradle.caching=true

#Kotlin
kotlin.code.style=official

#MPP
# required by the uniffi plugin for the Kotlin/Native targets
kotlin.mpp.enableCInteropCommonization=true
# the targets the host can't build (iOS outside of macOS) are skipped
kotlin.native.ignoreDisabledTargets=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# the-inkwell/gradle-tools: the catalog "additionals", the kt-plugins and the module setups
GRADLE_EXTENDED_VERSION_USED=2408cbb264323da96ad301e8b00e9ad8466ba76c
