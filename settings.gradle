// The Gradle builds of the Kotlin bindings of kraken-ffi (scripts/bindings.sh kotlin):
//
//   :kraken-kotlin    platforms/kotlin, the tests of the bindings on the JVM, with the library of the host
//   :kraken-android   platforms/android, the Android library (AAR) with the libraries of every ABI
//   :kraken-multiplatform   platforms/kotlin-multiplatform, the Kotlin Multiplatform library: JVM,
//                           Android, iOS, macOS, Linux (UbiqueInnovation/uniffi-kotlin-multiplatform-bindings)
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

def commonProps = new Properties()
new File(rootProject.projectDir, "gradle.properties").withInputStream { commonProps.load(it) }
ext.GRADLE_EXTENDED_VERSION_USED = commonProps.getProperty("GRADLE_EXTENDED_VERSION_USED")

apply from: "https://raw.githubusercontent.com/the-inkwell/gradle-tools/${ext.GRADLE_EXTENDED_VERSION_USED}/extended.gradle"

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
    versionCatalogs {
        additionals {
            from(files(gradle.extended.files.catalog))
        }
    }
}

includeBuild "gradle/extended/${ext.GRADLE_EXTENDED_VERSION_USED}/kt-plugins"

rootProject.name = "kraken-rust"

// the projects keep the names of their artifacts: build/outputs/aar/kraken-android-release.aar
include(":kraken-kotlin")
project(":kraken-kotlin").projectDir = file("platforms/kotlin")
include(":kraken-android")
project(":kraken-android").projectDir = file("platforms/android")
include(":kraken-multiplatform")
project(":kraken-multiplatform").projectDir = file("platforms/kotlin-multiplatform")
