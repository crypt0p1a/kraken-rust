# What makes the Kotlin bindings of the Rust crates: the uniffi plugin of Gradle, which builds its
# generator from its sources. The CI caches the generator on the hash of this file alone
# (build/uniffi/bindgen): change a version here, and only here, to install it again
[versions]
ubique-uniffi = "1.3.2"

[plugins]
ubique-uniffi = { id = "ch.ubique.uniffi.plugin", version.ref = "ubique-uniffi" }
